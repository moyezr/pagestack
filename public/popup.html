<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PasteStack settings</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header><img src="icons/48.png" width="32" height="32" alt=""><h1>PasteStack</h1></header>
  <label><input id="auto-paste" type="checkbox" disabled><span>Automatically add pasted images</span></label>
  <p>Paste an image and keep writing. Skip the image editor and its Next button.</p>
  <p>Turn this off to collect images in a tray and review them before adding them to your post.</p>
  <p class="hint">You can always edit photos in LinkedIn. Publishing stays in your hands.</p>
  <p id="status" role="status" aria-live="polite">Loading preference…</p>
</body>
</html>
